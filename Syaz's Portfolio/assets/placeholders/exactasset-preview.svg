  <text x="340" y="325" font-family="sans-serif" font-size="11" fill="#ffffff">MacBook Pro M3</text>
  <text x="470" y="325" font-family="sans-serif" font-size="11" fill="#ffffff">QA Intern / Syazreen</text>
  <rect x="610" y="312" width="90" height="18" rx="4" fill="#3d321d"/>
  <text x="655" y="325" font-family="sans-serif" font-size="10" fill="#e6c687" text-anchor="middle">Pending Email</text>

  <line x1="240" y1="385" x2="740" y2="385" stroke="#25293b" stroke-width="1"/>
  <text x="255" y="370" font-family="monospace" font-size="11" fill="#8c95b2">AST-2026-22</text>
