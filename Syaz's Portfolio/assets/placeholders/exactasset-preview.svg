  <text x="235" y="140" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">148</text>
  <text x="330" y="140" font-family="sans-serif" font-size="11" fill="#50fa7b">+12%</text>

  <rect x="400" y="85" width="165" height="80" rx="8" fill="url(#cardBg)" stroke="#2a2e40"/>
