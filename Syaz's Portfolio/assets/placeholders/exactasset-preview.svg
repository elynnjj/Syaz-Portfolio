      <stop offset="100%" stop-color="#1f1a24"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c89b65"/>
      <stop offset="100%" stop-color="#e6c687"/>
