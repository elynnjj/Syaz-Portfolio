<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121018"/>
      <stop offset="50%" stop-color="#1c1626"/>
      <stop offset="100%" stop-color="#111726"/>
    </linearGradient>
    <linearGradient id="accentGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#66d9ef"/>
      <stop offset="100%" stop-color="#a6e22e"/>
    </linearGradient>
    <linearGradient id="cardBg2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(28, 30, 44, 0.85)"/>
      <stop offset="100%" stop-color="rgba(18, 20, 32, 0.9)"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#bgGrad2)"/>
  <rect x="20" y="20" width="760" height="460" rx="12" fill="none" stroke="#332c44" stroke-width="1.5"/>
  
  <!-- Navbar -->
  <rect x="20" y="20" width="760" height="50" rx="12" fill="#181524"/>
  <text x="50" y="50" font-family="sans-serif" font-size="16" font-weight="bold" fill="#66d9ef">WorkLance</text>
  <text x="140" y="50" font-family="sans-serif" font-size="11" fill="#8c95b2">Find Projects</text>
  <text x="230" y="50" font-family="sans-serif" font-size="11" fill="#8c95b2">Hire Freelancers</text>
  <text x="330" y="50" font-family="sans-serif" font-size="11" fill="#8c95b2">Upload Resume</text>
  
  <rect x="650" y="32" width="110" height="26" rx="13" fill="url(#accentGrad2)" opacity="0.2"/>
  <text x="705" y="49" font-family="sans-serif" font-size="11" font-weight="bold" fill="#a6e22e" text-anchor="middle">Employer Hub</text>

  <!-- Hero Section inside Web app -->
  <rect x="40" y="90" width="720" height="130" rx="12" fill="url(#cardBg2)" stroke="#2f2a40"/>
  <text x="70" y="130" font-family="sans-serif" font-size="20" font-weight="bold" fill="#ffffff">Freelance Services Management Platform</text>
  <text x="70" y="155" font-family="sans-serif" font-size="12" fill="#9aa1b9">Connect employers with specialized tech talent &amp; digital solutions.</text>

  <rect x="70" y="170" width="320" height="34" rx="6" fill="#11131f" stroke="#3c435e"/>
  <text x="85" y="191" font-family="sans-serif" font-size="11" fill="#6a7394">Search web development, UI/UX, QA testing...</text>
  <rect x="400" y="170" width="100" height="34" rx="6" fill="#66d9ef"/>
  <text x="450" y="191" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0f111a" text-anchor="middle">Search</text>

  <!-- Freelancer Cards Grid -->
  <rect x="40" y="240" width="225" height="200" rx="8" fill="url(#cardBg2)" stroke="#2b273b"/>
  <circle cx="80" cy="275" r="20" fill="#c89b65"/>
  <text x="110" y="270" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Syazreen Elyna</text>
  <text x="110" y="285" font-family="sans-serif" font-size="10" fill="#66d9ef">Software Engineer</text>
  <text x="60" y="315" font-family="sans-serif" font-size="11" fill="#9aa1b9">Web Dev • QA Testing • PHP</text>
  <rect x="60" y="380" width="185" height="26" rx="4" fill="#251f36"/>
  <text x="152" y="397" font-family="sans-serif" font-size="10" fill="#a6e22e" text-anchor="middle">View Profile &amp; Resume</text>

  <rect x="285" y="240" width="230" height="200" rx="8" fill="url(#cardBg2)" stroke="#2b273b"/>
  <circle cx="325" cy="275" r="20" fill="#4a5568"/>
  <text x="355" y="270" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Job Listing: E-Commerce</text>
  <text x="355" y="285" font-family="sans-serif" font-size="10" fill="#e6c687">Active Project</text>
  <text x="305" y="315" font-family="sans-serif" font-size="11" fill="#9aa1b9">Laravel Backend &amp; MySQL DB</text>
  <rect x="305" y="380" width="190" height="26" rx="4" fill="#251f36"/>
  <text x="400" y="397" font-family="sans-serif" font-size="10" fill="#66d9ef" text-anchor="middle">Apply for Job</text>

  <rect x="530" y="240" width="230" height="200" rx="8" fill="url(#cardBg2)" stroke="#2b273b"/>
  <text x="550" y="270" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Centralized Resume Vault</text>
  <text x="550" y="295" font-family="sans-serif" font-size="11" fill="#9aa1b9">Instant PDF reference download for recruiters.</text>

  <!-- Overlay Watermark Badge -->
  <rect x="50" y="445" width="700" height="30" rx="6" fill="#100e17" stroke="#66d9ef" stroke-dasharray="4 4"/>
  <text x="400" y="464" font-family="monospace" font-size="11" fill="#66d9ef" text-anchor="middle">📷 Diploma FYP Screenshot Placeholder (WorkLance Platform)</text>
